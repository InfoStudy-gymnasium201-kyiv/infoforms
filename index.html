<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Інтерактивне тестування | InfoStudy</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0', 300: '#86efac',
              400: '#4ade80', 500: '#22c55e', 600: '#16a34a', 700: '#15803d',
              800: '#166534', 900: '#14532d', 950: '#052e16'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    .loader {
      border-top-color: #16a34a;
      -webkit-animation: spinner 1s linear infinite;
      animation: spinner 1s linear infinite;
    }
    @keyframes spinner {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-[#f8faf9] text-slate-800 antialiased selection:bg-brand-200 selection:text-brand-900 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-brand-100 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      
      <!-- Logo and Titles -->
      <div class="flex items-center space-x-3 overflow-hidden">
        <a href="https://infostudy-gymnasium201-kyiv.github.io" class="flex-shrink-0 hover:opacity-80 transition-opacity" title="На головну InfoStudy">
          <img src="https://github.com/InfoStudy-gymnasium201-kyiv/InfoStudy-gymnasium201-kyiv.github.io/blob/main/Extra/it405_logo.png?raw=true" alt="InfoStudy Logo" class="h-10 w-auto object-contain" />
        </a>
        <div class="min-w-0">
          <span class="text-xs font-semibold text-brand-700 uppercase tracking-wider block truncate">Система перевірки знань</span>
          <h1 id="header-title" class="text-sm md:text-base font-bold font-heading text-slate-800 truncate">Завантаження тесту...</h1>
        </div>
      </div>

      <!-- Right Section: Back Button -->
      <div class="flex items-center space-x-3 flex-shrink-0">
        <a href="https://infostudy-gymnasium201-kyiv.github.io" class="inline-flex items-center space-x-1.5 bg-brand-50 hover:bg-brand-100 text-brand-800 border border-brand-200 px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition-all shadow-sm hover:shadow">
          <i data-lucide="arrow-left" class="w-4 h-4 text-brand-600"></i>
          <span>На головну</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="bg-gradient-to-b from-brand-900 via-brand-800 to-emerald-900 text-white py-6 sm:py-8 md:py-12 relative overflow-hidden">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 text-center md:text-left">
      <div class="inline-flex items-center space-x-2 bg-brand-500/20 backdrop-blur-md border border-brand-400/30 px-3 py-1 rounded-full text-brand-200 text-xs font-medium mb-2.5">
        <i data-lucide="file-check-2" class="w-3.5 h-3.5 text-brand-400"></i>
        <span id="hero-badge">Тестування</span>
      </div>
      <h1 id="hero-title" class="text-xl sm:text-2xl md:text-3xl lg:text-4xl font-extrabold font-heading tracking-tight text-white mb-2 leading-tight">
        Завантаження матеріалів...
      </h1>
      <p id="hero-desc" class="text-brand-100 text-xs sm:text-sm max-w-3xl leading-relaxed">
        Будь ласка, уважно читайте запитання та вибирайте один із правильних варіантів відповідей.
      </p>
    </div>
  </section>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-8 flex-grow w-full">
    <div id="app">
      <!-- Контент динамічно генерується JS -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 py-4 sm:py-6 mt-8 sm:mt-12">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500">
      <p>© InfoStudy Gymnasium 201 Kyiv. Усі права захищено.</p>
    </div>
  </footer>

  <script>
    // --- STATE MANAGEMENT ---
    const state = {
        view: 'loading', // loading, quiz, submission, result, error
        quizData: null,
        quizFormat: 'old', // 'old' або 'new'
        userAnswers: {},
        error: '',
        studentName: '',
        studentClass: '',
        isSubmitting: false
    };

    // --- UTILITIES ---
    function validateJsonStructure(data) {
        if (!data || typeof data !== 'object') return false;
        
        // Перевіряємо новий формат (має 'title')
        if (data.title && typeof data.title === 'string' && Array.isArray(data.questions)) {
            state.quizFormat = 'new';
            return true;
        }
        
        // Перевіряємо старий формат (має 'quizTitle')
        if (data.quizTitle && typeof data.quizTitle === 'string' && Array.isArray(data.questions)) {
            state.quizFormat = 'old';
            return true;
        }

        return false;
    }

    function formatText(text) {
        if (!text) return '';
        return text.replace(/\/n/g, '\n');
    }

    function getUrlFromParams() {
        let queryString = window.location.search.substring(1); 
        if (!queryString) return null;
        if (queryString.startsWith('=')) {
            queryString = queryString.substring(1);
        }
        return "https://raw.githubusercontent.com/InfoStudy-gymnasium201-kyiv/InfoStudy-gymnasium201-kyiv.github.io/refs/heads/main/Extra/TestsJSONs/" + decodeURIComponent(queryString) + ".json";
    }

    // --- CONTROLLER FUNCTIONS ---
    async function init() {
        const jsonUrl = getUrlFromParams();

        if (!jsonUrl) {
            state.error = 'Не вказано ідентифікатор тесту в адресному рядку (наприклад: ?=назва_тесту).';
            setView('error');
            return;
        }

        try {
            const response = await fetch(jsonUrl);
            if (!response.ok) throw new Error(`HTTP помилка! Статус: ${response.status}`);
            const data = await response.json();
            
            if (validateJsonStructure(data)) {
                state.quizData = data;
                
                const title = data.title || data.quizTitle;
                const subject = data.subject ? ` | ${data.subject}` : '';

                // Оновлення текстових блоків у Header та Hero
                document.getElementById('header-title').innerText = title;
                document.getElementById('page-title').innerText = `${title}${subject} | Інтерактивні тести`;
                document.getElementById('hero-title').innerText = title;
                document.getElementById('hero-desc').innerText = `Тест містить ${data.questions.length} запитань. Перевірте свої знання та збережіть результат після виконання!`;
                
                setView('quiz');
            } else {
                state.error = 'Структура JSON-файлу тесту некоректна. Перевірте наявність полів "title" або "quizTitle".';
                setView('error');
            }
        } catch (err) {
            state.error = `Не вдалося завантажити тест: ${err.message}. Перевірте URL-адресу та з'єднання з мережею.`;
            setView('error');
        }
    }

    function setView(viewName) {
        state.view = viewName;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function handleAnswer(qIndex, answerValue) {
        state.userAnswers[qIndex] = answerValue;
        // Оновлюємо стан без перерендеру всього екрану для уникнення зсувів
        render(); 
    }

    function handleMatchingAnswer(qIndex, leftId, rightKey) {
        if (!state.userAnswers[qIndex] || typeof state.userAnswers[qIndex] !== 'object') {
            state.userAnswers[qIndex] = {};
        }
        if (rightKey === "") {
            delete state.userAnswers[qIndex][leftId];
        } else {
            state.userAnswers[qIndex][leftId] = rightKey;
        }
        render();
    }

    function handleBlankAnswer(qIndex, blankIndex, value) {
        if (!Array.isArray(state.userAnswers[qIndex])) {
            state.userAnswers[qIndex] = [];
        }
        state.userAnswers[qIndex][blankIndex] = value;
        // Не викликаємо render(), оскільки це перезаписує елементи input та збиває фокус клавіатури!
        updateQuizProgressUI();
    }

    function updateQuizProgressUI() {
        if (state.view !== 'quiz') return;
        const totalQuestions = state.quizData.questions.length;
        let answeredCount = 0;
        for (let i = 0; i < totalQuestions; i++) {
            if (isQuestionAnswered(i)) answeredCount++;
        }
        
        const isAllAnswered = answeredCount === totalQuestions;
        const progressPercentage = Math.round((answeredCount / totalQuestions) * 100);

        const counterEl = document.getElementById('progress-counter');
        if (counterEl) counterEl.innerText = `${answeredCount} з ${totalQuestions}`;

        const barEl = document.getElementById('progress-bar-inner');
        if (barEl) barEl.style.width = `${progressPercentage}%`;

        // Оновлення кнопок завершення
        const finishBtns = document.querySelectorAll('.finish-quiz-btn');
        finishBtns.forEach(btn => {
            btn.disabled = !isAllAnswered;
            if (isAllAnswered) {
                btn.classList.remove('bg-slate-100', 'bg-slate-200', 'text-slate-400', 'cursor-not-allowed');
                btn.classList.add('bg-brand-600', 'hover:bg-brand-700', 'text-white', 'cursor-pointer');
            } else {
                btn.classList.add('bg-slate-200', 'text-slate-400', 'cursor-not-allowed');
                btn.classList.remove('bg-brand-600', 'hover:bg-brand-700', 'text-white', 'cursor-pointer');
            }
        });
    }

    function isQuestionAnswered(qIndex) {
        const q = state.quizData.questions[qIndex];
        const userAns = state.userAnswers[qIndex];

        if (userAns === undefined || userAns === null) return false;

        if (state.quizFormat === 'old') {
            return userAns !== '';
        }

        // Перевірка за типами у новому форматі
        const type = q.type || 'single_choice';

        if (type === 'single_choice' || type === 'true_false') {
            return typeof userAns === 'string' && userAns.trim() !== '';
        }

        if (type === 'matching') {
            if (!userAns || typeof userAns !== 'object') return false;
            // Перевіряємо чи заповнено для всіх лівих елементів
            return q.left_items.every(lItem => userAns[lItem.id] && userAns[lItem.id] !== '');
        }

        if (type === 'fill_in_blanks') {
            if (!Array.isArray(userAns)) return false;
            const count = q.blanks_count || (Array.isArray(q.correct_answer) ? q.correct_answer.length : 1);
            for (let i = 0; i < count; i++) {
                if (!userAns[i] || userAns[i].trim() === '') return false;
            }
            return true;
        }

        return false;
    }

    function calculateScore() {
        let score = 0;
        let correctQuestionsCount = 0;
        const totalQuestions = state.quizData.questions.length;

        state.quizData.questions.forEach((q, idx) => {
            const userAns = state.userAnswers[idx];

            if (state.quizFormat === 'old') {
                if (userAns?.trim() === q.correctOption?.trim()) {
                    score += 1;
                    correctQuestionsCount += 1;
                }
            } else {
                const type = q.type || 'single_choice';

                if (type === 'single_choice' || type === 'true_false') {
                    if (userAns?.trim() === q.correct_answer?.trim()) {
                        score += 1;
                        correctQuestionsCount += 1;
                    }
                } else if (type === 'matching') {
                    if (userAns && typeof userAns === 'object' && typeof q.correct_answer === 'object') {
                        let isFullCorrect = true;
                        q.left_items.forEach(lItem => {
                            if (userAns[lItem.id] !== q.correct_answer[lItem.id]) {
                                isFullCorrect = false;
                            }
                        });
                        if (isFullCorrect) {
                            score += 1;
                            correctQuestionsCount += 1;
                        }
                    }
                } else if (type === 'fill_in_blanks') {
                    if (Array.isArray(userAns) && Array.isArray(q.correct_answer)) {
                        let isFullCorrect = true;
                        q.correct_answer.forEach((correctAns, bIdx) => {
                            const uVal = (userAns[bIdx] || '').trim().toLowerCase();
                            const cVal = correctAns.trim().toLowerCase();
                            if (uVal !== cVal) {
                                isFullCorrect = false;
                            }
                        });
                        if (isFullCorrect) {
                            score += 1;
                            correctQuestionsCount += 1;
                        }
                    }
                }
            }
        });

        // Завжди показуємо виключно у форматі "Кількість правильних / Всього"
        const scoreText = `${correctQuestionsCount} / ${totalQuestions}`;

        return { score: correctQuestionsCount, maxPoints: totalQuestions, correctQuestionsCount, totalQuestions, scoreText };
    }

    function updateStudentData(field, value) {
        state[field] = value;
        // Оновлюємо стан кнопки прямо в DOM без перерендеру всього інтерфейсу,
        // щоб мобільна клавіатура не закривалася після кожного введеного символу!
        const btn = document.getElementById('submit-btn');
        if (btn) {
            const isValid = state.studentName.trim().length > 0 && state.studentClass.trim().length > 0;
            btn.disabled = !isValid;
            if (isValid) {
                btn.className = "w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3.5 px-6 rounded-xl transition-all shadow-md hover:shadow-lg flex justify-center items-center gap-2 cursor-pointer";
            } else {
                btn.className = "w-full bg-slate-200 text-slate-400 font-bold py-3.5 px-6 rounded-xl cursor-not-allowed flex justify-center items-center gap-2";
            }
        }
    }

    function goToSubmission() {
        setView('submission');
    }

    async function submitResults() {
        if (!state.studentName.trim() || !state.studentClass.trim()) return;

        state.isSubmitting = true;
        render();

        // 1. Обчислення результату
        const { scoreText } = calculateScore();
        const dateStr = new Date().toLocaleString('uk-UA');

        // 2. Підготовка Google Form
        const formUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSd_Pbc892R85y2-DdYRnzAbJEGl_L5_sqhjmrFpEV1SSSpedw/formResponse';
        const formData = new URLSearchParams();
        
        formData.append('entry.36623648', state.studentName);     // ПІБ
        formData.append('entry.1910569412', state.studentClass);  // Клас
        formData.append('entry.619214537', scoreText);            // Оцінка
        formData.append('entry.1914754828', dateStr);             // Дата

        try {
            await fetch(formUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData
            });
            
            state.isSubmitting = false;
            setView('result');

        } catch (error) {
            console.error('Помилка відправки форми:', error);
            state.isSubmitting = false;
            setView('result'); 
        }
    }

    function restartQuiz() {
        window.location.reload();
    }

    // --- VIEW RENDERERS ---

    function renderLoading() {
        return `
            <div class="flex flex-col items-center justify-center py-20">
                <div class="loader rounded-full border-4 border-slate-200 h-14 w-14 mb-4"></div>
                <h2 class="text-lg font-bold font-heading text-slate-700">Завантаження питань тесту...</h2>
                <p class="text-xs text-slate-500 mt-1">Це займе лише декілька секунд</p>
            </div>
        `;
    }

    function renderError() {
        return `
            <div class="max-w-2xl mx-auto bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-red-200">
                <div class="flex items-center gap-4 mb-4">
                    <div class="bg-red-50 p-3 rounded-xl border border-red-100 flex-shrink-0">
                        <i data-lucide="alert-triangle" class="w-8 h-8 text-red-600"></i>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold font-heading text-slate-800">Помилка завантаження</h2>
                        <p class="text-xs text-slate-500">Не вдалося завантажити матеріали тесту</p>
                    </div>
                </div>
                <p class="text-slate-600 text-sm mb-6 leading-relaxed bg-slate-50 p-4 rounded-xl border border-slate-100">${state.error}</p>
                <div class="flex justify-end">
                    <a href="https://infostudy-gymnasium201-kyiv.github.io" class="bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition shadow-sm">
                        Повернутися на головну
                    </a>
                </div>
            </div>
        `;
    }

    function renderSubmission() {
        const isValid = state.studentName.trim() && state.studentClass.trim();

        return `
            <div class="max-w-xl mx-auto bg-white p-5 sm:p-8 rounded-2xl shadow-sm border border-slate-200">
                <div class="text-center mb-6 sm:mb-8">
                    <div class="bg-brand-50 border border-brand-100 p-3.5 sm:p-4 rounded-2xl inline-block mb-3">
                        <i data-lucide="user-check" class="w-8 h-8 sm:w-10 sm:h-10 text-brand-600"></i>
                    </div>
                    <h2 class="text-xl sm:text-2xl font-bold font-heading text-slate-800">Збереження результату</h2>
                    <p class="text-xs text-slate-500 mt-1">Введіть ваші дані для відправки оцінки вчителю</p>
                </div>

                <div class="space-y-4 sm:space-y-5">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5 sm:mb-2">Прізвище та Ім'я учня/учениці</label>
                        <input 
                            type="text" 
                            value="${state.studentName}"
                            oninput="updateStudentData('studentName', this.value)"
                            placeholder="Наприклад: Іванов Іван"
                            ${state.isSubmitting ? 'disabled' : ''}
                            class="w-full p-3 text-sm sm:text-base border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none disabled:bg-slate-50 transition"
                        >
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5 sm:mb-2">Клас</label>
                        <input 
                            type="text" 
                            value="${state.studentClass}"
                            oninput="updateStudentData('studentClass', this.value)"
                            placeholder="Наприклад: 10-А"
                            ${state.isSubmitting ? 'disabled' : ''}
                            class="w-full p-3 text-sm sm:text-base border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none disabled:bg-slate-50 transition"
                        >
                    </div>

                    <div class="pt-2">
                        <button 
                            id="submit-btn"
                            onclick="submitResults()"
                            ${!isValid || state.isSubmitting ? 'disabled' : ''}
                            class="${isValid && !state.isSubmitting 
                                ? 'w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3.5 px-6 rounded-xl transition-all shadow-md hover:shadow-lg flex justify-center items-center gap-2 cursor-pointer' 
                                : 'w-full bg-slate-200 text-slate-400 font-bold py-3.5 px-6 rounded-xl cursor-not-allowed flex justify-center items-center gap-2'}"
                        >
                            ${state.isSubmitting ? `
                                <div class="loader rounded-full border-2 border-slate-300 h-5 w-5 mr-2"></div>
                                Збереження...
                            ` : `
                                <i data-lucide="send" class="w-4 h-4"></i>
                                Завершити та надіслати
                            `}
                        </button>
                    </div>
                </div>
            </div>
        `;
    }

    function renderQuestionBody(q, idx) {
        if (state.quizFormat === 'old') {
            return renderSingleChoiceOptions(idx, q.options.map(opt => ({ key: '', text: opt })), 'text');
        }

        const type = q.type || 'single_choice';

        if (type === 'single_choice' || type === 'true_false') {
            return renderSingleChoiceOptions(idx, q.options, 'key');
        }

        if (type === 'matching') {
            const userMatching = state.userAnswers[idx] || {};
            
            const rightOptionsHtml = q.right_items.map(r => `
                <div class="p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-xs sm:text-sm text-slate-700 flex gap-2">
                    <span class="font-bold text-brand-700">${r.key}.</span>
                    <span>${formatText(r.text)}</span>
                </div>
            `).join('');

            const leftRowsHtml = q.left_items.map(l => {
                const selectedKey = userMatching[l.id] || '';
                
                const selectOptions = `
                    <option value="">-- Виберіть --</option>
                    ${q.right_items.map(r => `
                        <option value="${r.key}" ${selectedKey === r.key ? 'selected' : ''}>${r.key}</option>
                    `).join('')}
                `;

                return `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-3 bg-white border border-slate-200 rounded-xl">
                        <div class="text-xs sm:text-sm text-slate-800 font-medium flex gap-2">
                            <span class="font-bold text-brand-700">${l.id}.</span>
                            <span>${formatText(l.text)}</span>
                        </div>
                        <select 
                            onchange="handleMatchingAnswer(${idx}, ${l.id}, this.value)"
                            class="border border-slate-200 rounded-lg p-2 text-xs sm:text-sm focus:ring-2 focus:ring-brand-500 outline-none bg-slate-50 font-bold text-brand-800"
                        >
                            ${selectOptions}
                        </select>
                    </div>
                `;
            }).join('');

            return `
                <div class="space-y-4">
                    <div class="space-y-2">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Варіанти дій:</span>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                            ${rightOptionsHtml}
                        </div>
                    </div>
                    <div class="space-y-2">
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Установіть відповідність:</span>
                        <div class="space-y-2">
                            ${leftRowsHtml}
                        </div>
                    </div>
                </div>
            `;
        }

        if (type === 'fill_in_blanks') {
            const count = q.blanks_count || (Array.isArray(q.correct_answer) ? q.correct_answer.length : 1);
            const userBlanks = state.userAnswers[idx] || [];

            let inputsHtml = '';
            for (let b = 0; b < count; b++) {
                const val = userBlanks[b] || '';
                inputsHtml += `
                    <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-3">
                        <span class="text-xs font-bold text-brand-700 bg-brand-50 border border-brand-100 px-2.5 py-1 rounded-lg w-fit">
                            Пропуск ${b + 1}
                        </span>
                        <input 
                            type="text"
                            value="${val.replace(/"/g, '&quot;')}"
                            oninput="handleBlankAnswer(${idx}, ${b}, this.value)"
                            placeholder="Введіть відповідь..."
                            class="w-full sm:flex-grow p-2.5 text-xs sm:text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none"
                        />
                    </div>
                `;
            }

            return `
                <div class="space-y-3 bg-slate-50 p-3 sm:p-4 rounded-xl border border-slate-200">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-500 block mb-1.5 sm:mb-2">Вкажіть пропущені слова:</span>
                    ${inputsHtml}
                </div>
            `;
        }

        return '';
    }

    function renderSingleChoiceOptions(idx, options, compareField) {
        return `
            <div class="space-y-2 sm:space-y-2.5">
                ${options.map(opt => {
                    const optValue = opt[compareField] || opt.text || opt;
                    const isSelected = state.userAnswers[idx] === optValue;
                    const borderClass = isSelected 
                        ? 'border-brand-500 bg-brand-50/60 shadow-sm ring-1 ring-brand-500' 
                        : 'border-slate-200 hover:border-slate-300 hover:bg-slate-50';

                    return `
                        <label class="flex items-start gap-2.5 sm:gap-3 p-3 sm:p-3.5 rounded-xl border cursor-pointer transition-all ${borderClass}">
                            <div class="pt-0.5 flex-shrink-0">
                                <input
                                    type="radio"
                                    name="question-${idx}"
                                    value="${optValue.replace(/"/g, '&quot;')}" 
                                    ${isSelected ? 'checked' : ''}
                                    onchange="handleAnswer(${idx}, this.value)"
                                    class="w-4 h-4 text-brand-600 focus:ring-brand-500 border-slate-300"
                                />
                            </div>
                            <span class="text-slate-700 text-xs sm:text-sm leading-relaxed whitespace-pre-wrap">
                                ${opt.key ? `<strong class="text-brand-800 mr-1">${opt.key}.</strong>` : ''}${formatText(opt.text || opt)}
                            </span>
                        </label>
                    `;
                }).join('')}
            </div>
        `;
    }

    function renderQuiz() {
        const totalQuestions = state.quizData.questions.length;
        
        let answeredCount = 0;
        for (let i = 0; i < totalQuestions; i++) {
            if (isQuestionAnswered(i)) answeredCount++;
        }

        const isAllAnswered = answeredCount === totalQuestions;
        const progressPercentage = Math.round((answeredCount / totalQuestions) * 100);

        const questionsHtml = state.quizData.questions.map((q, idx) => {
            return `
                <section id="q-${idx}" class="bg-white p-4 sm:p-6 rounded-2xl border border-slate-200 shadow-sm scroll-mt-28">
                    <div class="flex items-start gap-2.5 sm:gap-3 mb-3 sm:mb-4">
                        <span class="px-2.5 py-0.5 sm:py-1 bg-brand-100 text-brand-800 text-xs font-bold rounded-lg flex-shrink-0 mt-0.5">
                            ${idx + 1}
                        </span>
                        <h3 class="text-sm sm:text-base md:text-lg font-bold font-heading text-slate-800 leading-snug whitespace-pre-wrap">
                            ${formatText(q.question)}
                        </h3>
                    </div>
                    ${renderQuestionBody(q, idx)}
                </section>
            `;
        }).join('');

        const navGrid = state.quizData.questions.map((_, idx) => {
            const isAnswered = isQuestionAnswered(idx);
            const bgClass = isAnswered 
                ? 'bg-brand-600 text-white font-bold' 
                : 'bg-slate-100 text-slate-600 hover:bg-slate-200';

            return `
                <a href="#q-${idx}" class="h-8 w-8 sm:h-9 sm:w-9 rounded-lg flex items-center justify-center text-xs transition ${bgClass}">
                    ${idx + 1}
                </a>
            `;
        }).join('');

        return `
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8">
                
                <!-- Sidebar status & navigation (Sticky on mobile & desktop) -->
                <aside class="lg:col-span-3">
                    <div class="sticky top-16 lg:top-20 z-40 bg-white/95 backdrop-blur-md rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-sm space-y-3 sm:space-y-5">
                        <div>
                            <div class="flex justify-between items-center mb-1.5 sm:mb-2">
                                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Прогрес</span>
                                <span id="progress-counter" class="text-xs font-bold text-brand-700">${answeredCount} з ${totalQuestions}</span>
                            </div>
                            <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                                <div id="progress-bar-inner" class="bg-brand-500 h-full transition-all duration-300" style="width: ${progressPercentage}%"></div>
                            </div>
                        </div>

                        <div>
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2 sm:mb-3">Навігація</span>
                            <div class="flex flex-wrap gap-1.5 sm:gap-2 max-h-28 lg:max-h-none overflow-y-auto pr-1">
                                ${navGrid}
                            </div>
                        </div>

                        <div class="pt-2 border-t border-slate-100">
                            <button
                                onclick="goToSubmission()"
                                ${!isAllAnswered ? 'disabled' : ''}
                                class="finish-quiz-btn w-full py-2.5 sm:py-3 px-4 rounded-xl font-bold text-xs sm:text-sm shadow transition-all flex items-center justify-center gap-2 ${isAllAnswered ? 'bg-brand-600 hover:bg-brand-700 text-white cursor-pointer' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}"
                            >
                                <span>Завершити тест</span>
                                <i data-lucide="check-circle" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </aside>

                <!-- Questions list -->
                <div class="lg:col-span-9 space-y-4 sm:space-y-6">
                    ${questionsHtml}
                    
                    <div class="pt-4 flex justify-end">
                        <button
                            onclick="goToSubmission()"
                            ${!isAllAnswered ? 'disabled' : ''}
                            class="finish-quiz-btn w-full sm:w-auto py-3.5 px-8 rounded-xl font-bold text-sm shadow-md transition-all flex items-center justify-center gap-2 ${isAllAnswered ? 'bg-brand-600 hover:bg-brand-700 text-white transform hover:-translate-y-0.5' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}"
                        >
                            Завершити тест
                            <i data-lucide="arrow-right" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </div>
        `;
    }

    function renderResult() {
        const { correctQuestionsCount, totalQuestions, scoreText } = calculateScore();

        const ratio = totalQuestions > 0 ? correctQuestionsCount / totalQuestions : 0;
        
        let scoreBadge = 'bg-red-100 text-red-700 border-red-200';
        let message = 'Спробуйте ще раз для покращення результату!';
        
        if (ratio >= 0.5) { 
            scoreBadge = 'bg-amber-100 text-amber-800 border-amber-200'; 
            message = 'Хороший результат!'; 
        }
        if (ratio >= 0.8) { 
            scoreBadge = 'bg-emerald-100 text-emerald-800 border-emerald-200'; 
            message = 'Чудовий результат! Вітаємо!'; 
        }

        return `
            <div class="max-w-2xl mx-auto space-y-8">
                <!-- Result Summary Header -->
                <div class="bg-white p-8 sm:p-10 rounded-2xl border border-slate-200 shadow-sm text-center">
                    <div class="inline-flex items-center justify-center p-4 rounded-full bg-brand-50 border border-brand-100 mb-4">
                        <i data-lucide="award" class="w-12 h-12 text-brand-600"></i>
                    </div>
                    <h2 class="text-2xl sm:text-3xl font-bold font-heading text-slate-800 mb-2">Тест завершено</h2>
                    
                    <div class="inline-block px-6 py-2.5 rounded-full border text-3xl font-extrabold font-heading ${scoreBadge} my-4">
                        ${scoreText}
                    </div>
                    
                    <p class="text-slate-600 text-sm max-w-md mx-auto mb-6">${message}</p>
                    
                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 inline-flex items-center gap-3 text-xs sm:text-sm text-slate-600 mb-6">
                        <i data-lucide="check-circle-2" class="w-5 h-5 text-brand-600 flex-shrink-0"></i>
                        <span>Результат збережено для: <strong class="text-slate-800">${state.studentName} (${state.studentClass})</strong></span>
                    </div>

                    <div class="flex justify-center">
                        <button
                            onclick="restartQuiz()"
                            class="bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 px-6 rounded-xl transition flex items-center gap-2 text-xs sm:text-sm shadow-sm"
                        >
                            <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                            Пройти тест повторно
                        </button>
                    </div>
                </div>
            </div>
        `;
    }

    // --- MAIN RENDER LOOP ---
    function render() {
        const app = document.getElementById('app');
        
        if (state.view === 'loading') {
            app.innerHTML = renderLoading();
        } else if (state.view === 'error') {
            app.innerHTML = renderError();
        } else if (state.view === 'quiz') {
            app.innerHTML = renderQuiz();
        } else if (state.view === 'submission') {
            app.innerHTML = renderSubmission();
        } else if (state.view === 'result') {
            app.innerHTML = renderResult();
        }
        
        if (window.lucide) {
            lucide.createIcons();
        }
    }

    // Start App Initialization
    init();

  </script>
</body>
</html>
